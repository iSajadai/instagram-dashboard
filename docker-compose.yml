# The panel with its data in ./var. Open http://localhost:8000 and create the admin account.
# On a server, put it behind HTTPS (deploy/nginx-panel.conf) and set SAJADAI_SECURE_COOKIES=1 in .env.
services:
  panel:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SAJADAI_PORT:-8000}:8000"   # SAJADAI_PORT in .env picks another local port
    volumes:
      - ./var:/data
    env_file:
      - path: .env
        required: false
