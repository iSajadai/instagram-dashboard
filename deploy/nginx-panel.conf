# nginx in front of the panel (docker compose or the systemd unit, both on 127.0.0.1:8000).
# Replace __HOST__ and the certificate paths; with Cloudflare, use an Origin Certificate as in nginx-cloudflare.conf.
server {
    listen 80;
    listen [::]:80;
    server_name __HOST__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __HOST__;

    ssl_certificate     /etc/ssl/cloudflare/__HOST__.pem;
    ssl_certificate_key /etc/ssl/cloudflare/__HOST__.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;   # refresh_data over MCP can take a minute
    }

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
